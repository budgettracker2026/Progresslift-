<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Workout Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #121212;
            color: #fff;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #00d4ff;
        }

        select {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .exercise {
            background: #1f1f1f;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        .exercise h3 {
            margin-bottom: 10px;
            color: #00d4ff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 8px;
            text-align: center;
            border: 1px solid #333;
        }

        input[type="number"] {
            width: 80px;
            padding: 5px;
            text-align: center;
        }

        .save-btn {
            width: 100%;
            padding: 15px;
            background: #00d4ff;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
        }

        .save-btn:hover {
            background: #00b5d9;
        }

        .stats {
            background: #1f1f1f;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .completed {
            color: lime;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>🏋️ Nebin Gym Workout Tracker</h1>
    <div class="stats">
        <h2>Workout Summary</h2>
        <p>Total Weight Lifted: <span id="totalWeight">0</span> kg</p>
    </div>
    <p><select id="daySelector" onchange="loadWorkout()">&nbsp;<option value="day1">Day 1 - Upper Body (Push &amp; Core)</option>
            <option value="day2">Day 2 - Lower Body &amp; Core</option>
            <option value="day3">Day 3 - Upper Body (Shoulders)</option>
            <option value="day4">Day 4 - Upper Body (Back)</option>
            <option value="day5">Day 5 - Lower Body (Legs)</option>&nbsp;
        </select></p>
    <div id="workoutContainer"><br></div>
    <p><button class="save-btn" onclick="saveWorkout()">💾 Save Workout</button></p>
    <script>
        const workouts = {
            day1: [
                "Bench Press",
                "Incline Dumbbell Press",
                "Chest Fly",
                "Tricep Pushdown",
                "Overhead Tricep Extension",
                "Plank",
                "Russian Twists"
            ],
            day2: [
                "Squats",
                "Leg Press",
                "Walking Lunges",
                "Leg Curl",
                "Hanging Leg Raises",
                "Bicycle Crunches"
            ],
            day3: [
                "Overhead Press",
                "Lateral Raises",
                "Front Raises",
                "Rear Delt Fly",
                "Upright Rows",
                "Shrugs"
            ],
            day4: [
                "Lat Pulldown",
                "Barbell Row",
                "Seated Cable Row",
                "Face Pulls",
                "Dumbbell Curl",
                "Hammer Curl"
            ],
            day5: [
                "Deadlift",
                "Bulgarian Split Squat",
                "Leg Extension",
                "Romanian Deadlift",
                "Standing Calf Raises",
                "Seated Calf Raises"
            ]
        };
        
        function loadWorkout() {
        
            const selectedDay = document.getElementById("daySelector").value;
            const container = document.getElementById("workoutContainer");
        
            container.innerHTML = "";
        
            workouts[selectedDay].forEach((exercise,index)=>{
        
                let html = `
                <div class="exercise">
                    <h3>${exercise}</h3>
        
                    <table>
                        <tr>
                            <th>Set</th>
                            <th>Weight (kg)</th>
                            <th>Reps</th>
                            <th>Done</th>
                        </tr>`;
        
                for(let set=1; set<=4; set++){
        
                    html += `
                    <tr>
                        <td>${set}</td>
                        <td>
                            <input type="number"
                            id="${selectedDay}_${index}_${set}_weight"
                            value="${localStorage.getItem(selectedDay+'_'+index+'_'+set+'_weight') || ''}">
                        </td>
        
                        <td>
                            <input type="number"
                            id="${selectedDay}_${index}_${set}_reps"
                            value="${localStorage.getItem(selectedDay+'_'+index+'_'+set+'_reps') || ''}">
                        </td>
        
                        <td>
                            <input type="checkbox"
                            id="${selectedDay}_${index}_${set}_done"
                            ${localStorage.getItem(selectedDay+'_'+index+'_'+set+'_done') === 'true' ? 'checked' : ''}>
                        </td>
                    </tr>`;
                }
        
                html += `</table></div>`;
                container.innerHTML += html;
            });
        
            calculateTotalWeight();
        }
        
        function saveWorkout(){
        
            const selectedDay = document.getElementById("daySelector").value;
        
            workouts[selectedDay].forEach((exercise,index)=>{
        
                for(let set=1; set<=4; set++){
        
                    const weight =
                    document.getElementById(`${selectedDay}_${index}_${set}_weight`).value;
        
                    const reps =
                    document.getElementById(`${selectedDay}_${index}_${set}_reps`).value;
        
                    const done =
                    document.getElementById(`${selectedDay}_${index}_${set}_done`).checked;
        
                    localStorage.setItem(
                        `${selectedDay}_${index}_${set}_weight`,
                        weight
                    );
        
                    localStorage.setItem(
                        `${selectedDay}_${index}_${set}_reps`,
                        reps
                    );
        
                    localStorage.setItem(
                        `${selectedDay}_${index}_${set}_done`,
                        done
                    );
                }
            });
        
            calculateTotalWeight();
        
            alert("Workout Saved Successfully!");
        }
        
        function calculateTotalWeight(){
        
            let total = 0;
        
            Object.keys(localStorage).forEach(key=>{
        
                if(key.includes("_weight")){
        
                    const weight = Number(localStorage.getItem(key));
        
                    const repsKey = key.replace("_weight","_reps");
        
                    const reps = Number(localStorage.getItem(repsKey));
        
                    total += weight * reps;
                }
            });
        
            document.getElementById("totalWeight").innerText = total;
        }
        
        loadWorkout();
        
    </script>
</body>

</html>
